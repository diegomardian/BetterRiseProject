[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betterrise"
version = "0.1.0"
description = "Compositional vs. cell-intrinsic decomposition of differentiation-marker loss in colorectal cancer"
requires-python = ">=3.10"

# Deliberately thin. Everything here is needed by the SHARED code in src/schema.py
# and src/common/. Workstream-specific heavy dependencies (scanpy, CellBender,
# inferCNV, lifelines, ...) live in the per-workstream conda envs under env/.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# What CI installs. It must be able to IMPORT every module under src/, or the
# test run dies at collection rather than failing a test.
#
# So the rule is: if your workstream's module is imported by a test and needs a
# package that is not in `dependencies` above, add it here when it is light and
# pip-installable (scipy, statsmodels, scikit-learn). Do NOT add the heavy or
# non-pip ones — CellBender, inferCNV, r-base — and do NOT paper over the gap
# with pytest.importorskip, which turns a missing dependency into silently
# untested code.
#
# A LAZY import does not exempt you. src/estimator/hierarchical.py imports
# statsmodels inside the function, so collection succeeds and the failure moves
# from "1 error" to "4 failed" — quieter, equally red. If a test executes the
# path, the package belongs here.
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "scipy>=1.11",  # src/harness/deconvolve/nnls.py
    "statsmodels>=0.14",  # src/estimator/hierarchical.py (lazy import, still needed)
    "scikit-learn>=1.3",  # src/harness/deconvolve/nusvr.py (lazy import, still needed)
    "lifelines>=0.29",  # src/bulk/survival.py (lazy import, still needed)
    "diptest>=0.5",  # src/bulk/premise.py (lazy import, still needed)
    "matplotlib>=3.7",  # src/bulk/premise.py, src/bulk/run_survival.py — figures
    "requests>=2.31",  # src/bulk/{gdc,cdr,clinical,purity,replication}.py — fetchers
]

[tool.setuptools.packages.find]
# The frozen repo contract puts everything under src/ with that exact name,
# so `src` is the package root: `from src.schema import ...`.
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
