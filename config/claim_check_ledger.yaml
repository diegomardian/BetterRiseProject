    guard_test: test_the_invariant_1_check_fires_on_a_zero_standing_in_for_none
    classification: implementation_error
    ambiguous_with: provenance_reporting_error
    rationale: the check was correct and not wired into the paths it was written to protect
    verdict: scientific_failure
    dispute_note: null

  - id: L09
    short_name: invariant 2
    the_check: targets absent from the signature matrix
    why_it_could_not_fail: a positional index read as a symbol; no reject option
    source_anchor: "docs/HANDOFF.md §3 table"
    ordinal_claimed: null
    found_by: review
    guard_test: test_the_leakage_guard_refuses_a_positional_index
