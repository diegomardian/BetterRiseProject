    source_anchor: "docs/HANDOFF.md §3 table"
    ordinal_claimed: null
    found_by: review
    guard_test: test_a_saturated_control_is_not_compared_naively_on_detection
    classification: logical_impossibility
    ambiguous_with: null
    rationale: a proportion at its ceiling cannot register the decrease the control exists to detect
    verdict: scientific_failure
    dispute_note: null

