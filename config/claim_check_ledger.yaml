      §5 that fixes three weightings with none primary and pre-commits no
      majority vote
    verdict: scientific_failure
    dispute_note: >-
      HANDOFF calls this "the same failure one step further out than the
      seventeenth" and gives it no ordinal, so whether it is a ledger entry or a
      note attached to L22 is exactly the ambiguity this file exists to surface.
