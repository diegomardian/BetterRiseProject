    verdict: scientific_failure
    dispute_note: null

  - id: L10
    short_name: gene specificity
    the_check: one gene's detection delta against another's
    why_it_could_not_fail: >-
      a proportion's sensitivity scales with its baseline, and the fixture
      contained no baselines
    source_anchor: "docs/HANDOFF.md §3 table; §6d"
    ordinal_claimed: 14
    found_by: review
    guard_test: test_a_uniform_thinning_is_not_reported_as_gene_specific
    classification: logical_impossibility
    ambiguous_with: implementation_error
    rationale: >-
      relative to its fixture the guard had no baseline to vary, so no input in
      its domain could have failed it; the underlying statistic compared
      quantities that are not comparable across baselines
    verdict: scientific_failure
    dispute_note: null

  - id: L11
    short_name: the interval itself
    the_check: percentile bootstrap over patients
    why_it_could_not_fail: >-
      a normal quantile where a t quantile is needed, with a biased sd; 0.82x
      the correct width at n=10
    source_anchor: "docs/HANDOFF.md §3 table; §3a"
    ordinal_claimed: 15
    found_by: review
    guard_test: test_the_calibration_check_reports_miscalibrated_on_the_interval_in_use
    classification: implementation_error
    ambiguous_with: low_power
    rationale: >-
      the estimator is misspecified rather than underpowered; the consequence is
      anti-conservative coverage at small n
    verdict: scientific_failure
    dispute_note: >-
      The audit's qualification stands and is not a dispute about the defect: the
      width expression is a normal-approximation comparison for the sample mean,
      not an exact distribution-free coverage formula, and the measured result is
      about the tested generators.

  - id: L12
