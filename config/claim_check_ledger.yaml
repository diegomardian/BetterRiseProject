# The claim-check ledger, enumerated.
#
# docs/HANDOFF.md §3 asserts in prose that a check unable to fail has been found
# "twenty-one" times. Nothing in the repository enumerates those twenty-one, and
# the ordinals are scattered across five sections (§3, §6g, §6k, §6m, §6n) while
# §7 still says "the ledger is at seventeen". This file is the first
# enumeration. It is DATA, not analysis: every field is a transcription or a
# judgement, and the judgement fields name their rater.
#
# Written 2026-09-11 for week 1 of docs/DECISION_2026-09-11_scope_and_pivot.md.
#
# The count does not reconcile, and that is recorded rather than resolved:
# transcribing every entry the repository describes yields MORE entries than the
# prose asserts. See `claim_check_inventory.py`, which refuses to write if the
# enumerated count silently equals the asserted one without a reconciliation.

meta:
  asserted_count: 21          # docs/HANDOFF.md §3, first paragraph
  asserted_count_anchor: "docs/HANDOFF.md §3"
  stale_count_elsewhere: 17   # docs/HANDOFF.md §7 — not corrected when §3 moved
  reconciliation_note: >-
    Enumerating every entry the repository describes gives 23 against the 21
    asserted in docs/HANDOFF.md §3, a difference of +2. It is recorded, not
    resolved, because resolving it means editing §3, which belongs to the
    write-up. The two candidate sources, both visible in the text: (a) §3's
    prose says "the five found on 2026-09-05" and then lists FOUR bullets, so
    one member of that five is already a row in the §3 table and may be counted
    twice here as L08 or L09; (b) L23 carries no ordinal and §6n calls it "a
    sibling worth reporting beside" L22 rather than numbering it, so whether it
    is a ledger entry or an annotation on L22 is undecided in the source. Under
    reading (a)+(b) the count is 21 exactly. That is a plausible reconstruction
    and it is not what any document says, so it is not adopted.
  rater: rater_a
  rater_note: >-
    Single rater. The week-1 plan calls for two independent classifiers and
    inter-rater agreement is NOT established by this file. A second rater writes
    config/claim_check_ledger_rater_b.yaml with the same ids and only the
    judgement fields; the job then reports agreement. Until that file exists the
    inventory is one opinion with criteria attached.

# Judgement vocabularies, fixed here before any entry was classified.
classes:
  logical_impossibility: >-
    No dataset could have made the check fail. The compared quantity is bounded
    away from the threshold, the comparison is vacuous, or the criterion is
    unreachable by construction.
  low_power: >-
    The check could fail on some data, but not at the sample size, noise level
    or effect size it was actually run at.
  implementation_error: >-
    The code computes something other than what was specified. A correct
    specification, wrongly executed.
  provenance_reporting_error: >-
    Two statements of one quantity were never compared, documentation and
    implementation diverged, or prose overrode an artifact that was correct.

verdicts:
  scientific_failure: >-
    A check that was supposed to be able to reject a scientific claim, and could
    not. Counts toward the week-1 stop rule.
  algebraic_identity: >-
    The "failure" is a mathematical identity behaving as identities do. Does NOT
    count toward the stop rule.
  disputed: >-
    Contested between the repository's reading and the 2026-09-11 audit. Does
    not count toward the stop rule until resolved.

entries:
  - id: L01
    short_name: recovery curve
    the_check: estimator output against known truth
    why_it_could_not_fail: the estimator cancels, so the curve measures the generator
    source_anchor: "docs/HANDOFF.md §3 table"
    ordinal_claimed: null
    found_by: review
    guard_test: null
    classification: logical_impossibility
    ambiguous_with: null
    rationale: no generator setting makes a cancelling estimator disagree with itself
    verdict: disputed
    dispute_note: >-
      The 2026-09-11 audit holds that a sample mean equalling the realised
      sample mean is an identity, that simulation can still validly measure bias,
      variance and coverage against a population mean, and that a deterministic
      function of the same sufficient statistics need not be the same function.
      Under that reading this is an algebraic_identity, not a missed failure.
      Unresolved; it is the single most consequential disagreement in the ledger
      because the WMHS paper's thesis rests on it.

  - id: L02
    short_name: calibration grid
    the_check: where the pre-registered criteria first hold
    why_it_could_not_fail: the grid could not reach the crossing
    source_anchor: "docs/HANDOFF.md §3 table"
    ordinal_claimed: null
    found_by: review
    guard_test: test_the_check_cannot_fire_below_the_crossing_prevalence
    classification: logical_impossibility
    ambiguous_with: null
    rationale: the crossing lies outside the evaluated support, so no grid cell can report it
    verdict: scientific_failure
    dispute_note: null

  - id: L03
    short_name: depth confound
    the_check: rho against a tolerance of 0.20
    why_it_could_not_fail: "the sqrt(3p(1-p)) ceiling sits below the tolerance"
    source_anchor: "docs/HANDOFF.md §3 table"
    ordinal_claimed: null
    found_by: review
    guard_test: test_a_correlation_is_never_normalised_by_another_arms_bound
    classification: logical_impossibility
    ambiguous_with: null
    rationale: the statistic's attainable maximum is below the threshold it is compared to
    verdict: scientific_failure
    dispute_note: null

  - id: L04
    short_name: calibration rates
    the_check: coverage and discrimination
    why_it_could_not_fail: "`nan > x` is False, so abstention scored as failure"
    source_anchor: "docs/HANDOFF.md §3 table"
    ordinal_claimed: null
    found_by: review
    guard_test: test_an_abstention_is_not_counted_as_a_coverage_failure
    classification: implementation_error
    ambiguous_with: null
    rationale: NaN comparison semantics silently recoded a third outcome as one of two
    verdict: scientific_failure
    dispute_note: null

  - id: L05
    short_name: width gate
    the_check: interval width against a threshold
