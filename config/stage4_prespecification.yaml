# =============================================================================
# Stage 4 — how much of bulk GUCA2A and CDX2 does mature-colonocyte FRACTION
# explain? Pre-specified before the analysis is run.
#
# STATUS: LOCKED 2026-09-05, on the project owner's instruction, before the
# variance arm ran. See `lock_authorisation`.
#
# execution_plan.md §6.2 asks this as the bulk arm's contribution to the paper,
# and PR #49's decomposition now makes it a DIRECTIONAL prediction rather than
# an open question. A directional prediction reported after the fact is a story;
# reported before, it is a test. This file exists so it is the second one.
#
# The same mechanism as config/covariate_set.yaml: committed `proposed`, flipped
# to `locked` in its own commit once the team confirms, and
# `src/bulk/prespec.py:require_locked_prespec` refuses to let the analysis run
# against a proposed spec. A pre-specification that does not stop you running is
# a document, not a lock.
#
# Reasoning: the comment on PR #49. AMENDED 2026-08-30 for issue #54 — see
# `prediction.withdrawn_arms` and decision #26.
# =============================================================================

version: "1.0.0"
status: locked            # proposed | locked
proposed_on: "2026-08-28"
proposed_by: W3
locked_on: "2026-09-05"
locked_by: bodemeowsers
lock_authorisation: >
  Locked on 2026-09-05 by the project owner, who reviewed this file as it stood
  and gave the instruction to run the variance arm. NOTHING IN THE FILE WAS
  EDITED IN THE SAME BREATH: the prediction, the matched-null rule, the
  instrument checks and the withdrawn arms are byte-identical to the version
  that has been committed since the 2026-08-30 amendment for issue #54 — only
  the six lock fields and the STATUS header above changed. That separation is
  the only thing that makes the lock mean anything, and `git show` on this
  commit is how a reader checks it rather than taking this sentence's word.

  What this lock is NOT: a claim of team sign-off. The W3.6 precedent records a
  named reviewer of a written memo; this one records one person's instruction,
  and it is written down that way so nobody later reads more consensus into it
  than there was.

# -----------------------------------------------------------------------------
# The question, from execution_plan.md §6.2, unedited.
# -----------------------------------------------------------------------------
question: >
  Does the fraction — rather than the marker — carry the prognostic signal in
  TCGA? How much variance in bulk GUCA2A and CDX2 is explained by
  mature-colonocyte fraction alone? If most of it, then CDX2, which already
  influences adjuvant decisions, is substantially a differentiation-content
  readout.

# -----------------------------------------------------------------------------
# THE PREDICTION. This is the part that must be written down first.
#
# PR #49 finds tier A's loss is predominantly INTRINSIC (all four of GUCA2A,
# GUCA2B, CA7, OTOP2 have intrinsic bands excluding zero and compositional bands
# containing it), while CDX2 runs the other way — compositional
# [-0.409, -0.039] excluding zero, intrinsic containing it.
#
# The bulk arm sees the same asymmetry from the other side: GUCA2A sits at 1.40%
# of normal in TCGA and 1.72% in GSE39582, while CDX2 sits at 94.7% and 84.8%.
# Two markers of the SAME cell population cannot diverge ~55-fold if the only
# thing that happened is that the cells left.
#
# If that reading is right, mature-colonocyte fraction should explain little of
# bulk GUCA2A and comparatively more of bulk CDX2.
# -----------------------------------------------------------------------------
#
# AMENDED 2026-08-30, before locking, in response to issue #54. The original
# arms were a bare R-squared comparison between GUCA2A and CDX2 and a bare
# R-squared < 0.25 threshold. Both were unsound and are withdrawn — see
# `withdrawn_arms` at the bottom of this block for what they said and why they
# could be satisfied with nothing intrinsic in the data.
prediction:
  statistic: >
    For each outcome gene: R-squared of that gene on mature-colonocyte fraction,
    expressed as its PERCENTILE within an abundance-matched null distribution of
    non-panel genes (see `matched_null`). Never a raw R-squared, and never a
    raw R-squared compared between two genes.
  statistic_rationale: >
    R-squared is a share of variance, so a gene near the assay floor loses it to
    measurement noise whatever its biology. GUCA2A sits at 1.40% of normal and
    CDX2 at 94.7% — a ~68-fold difference in dynamic range against a common
    noise floor — so comparing their R-squared compares their abundance. The
    matched null removes that by asking a different question: is this gene's
    R-squared larger than that of genes at the SAME abundance? Same
    excess-over-null idiom W3.4 used for Cramer's V and PVCA.

  primary:
    statement: >
      GUCA2A's R-squared falls WITHIN its abundance-matched null (percentile
      <= 0.95) while CDX2's rises ABOVE its own (percentile > 0.95), in both
      cohorts independently.
    rationale: >
      This is the intrinsic/compositional split stated in a form that abundance
      cannot fake. If GUCA2A's loss is intrinsic, fraction explains no more of
      it than of any equally-expressed gene with no differentiation story. If
      CDX2's small loss is compositional, fraction explains more of it than
      abundance alone predicts.
    disconfirmed_if: >
      GUCA2A exceeds its matched null (percentile > 0.95) while CDX2 does not.
      That is the compositional reading and it contradicts #49. If BOTH exceed,
      or NEITHER does, the result is indeterminate and is reported in those
      words rather than resolved toward either arm.

  secondary:
    statement: >
      CDX2's excess over its matched null median is greater than GUCA2A's, in
      both cohorts.
    rationale: >
      An effect-size companion to the primary's threshold test, so a result
      that sits either side of the 0.95 line by a hair is not reported as a
      clean answer. Excess is a difference of two R-squared values computed at
      the SAME abundance, so it is comparable in a way the raw values are not.
    disconfirmed_if: >
      GUCA2A's excess exceeds CDX2's in either cohort.

  interpretation_note: >
    None of this can establish the intrinsic reading. Bulk has no independent
    read on cell-type identity (invariant 6). It can only ask whether the marker
    pattern is one the compositional account can produce. A confirmed prediction
    is consistency; a disconfirmed one is a real problem for #49.

  withdrawn_arms:
    - statement: "R-squared(GUCA2A) < R-squared(CDX2)"
      withdrawn: "2026-08-30, issue #54, before locking"
      why: >
        Satisfied on simulated data where BOTH genes are purely compositional
        and differ only in abundance. Reproduced: under pure composition with an
        assay floor, the 1.4%-of-normal gene returns R-squared 0.891 -> 0.000 as
        the floor rises while the 94.7% gene holds at ~0.86. The arm measured
        the floor, not the biology.
    - statement: "R-squared(GUCA2A) < 0.25 in TCGA"
      withdrawn: "2026-08-30, issue #54, before locking"
      why: >
        Added so the primary could not be satisfied by both values being near
        zero. It does not close the other route, where the low one is low for a
        technical reason. Its threshold is also uninterpretable: the value of
        R-squared at GUCA2A's abundance depends on the assay floor, which is not
        known in advance, so 0.25 could not be given a meaning before the run.
    - statement: "log-log slope of expression on fraction, instead of R-squared"
      withdrawn: "2026-08-30, considered and rejected"
      why: >
        Issue #54 offered this as an alternative to the matched control, on the
        grounds that it is scale-free. Tested on the same simulation and it is
        NOT: under pure composition the slope reads 0.742 for the low-abundance
        gene against 0.989 for the high-abundance one, and collapses to 0.023 as
        the floor rises. Floor effects bias the slope as well as the variance
        share. Recorded so nobody re-proposes it.

# -----------------------------------------------------------------------------
# INSTRUMENT CHECKS. Without these a low R-squared is uninterpretable — it could
# be biology or it could be that deconvolution does not work on this cohort, and
# those have opposite consequences. Both are pre-committed, and the positive
# control GATES the analysis: if the instrument fails, no R-squared is reported.
#
# Note what is NOT used as a control: a "known compositional" marker gene. Every
# canonical mature-colonocyte marker is on the frozen panel, and which of them
# are compositional is the question rather than an input to it. Picking one
# would beg it.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# THE ABUNDANCE-MATCHED NULL. Issue #54's fix, generalised from one control gene
# to a distribution — a single matched control is a point estimate of a noisy
# quantity, and the draw rule below costs nothing extra to run.
#
# The rule is ALGORITHMIC and committed here rather than a hand-picked gene
# list, so it cannot be adjusted after seeing which genes landed in it. It is
# implemented in src/bulk/prespec.py:matched_null_genes and pinned by tests.
# -----------------------------------------------------------------------------
matched_null:
  candidates:
    on_shared_index: true          # config/gene_index/gene_index_1.0.0.txt
    exclude_frozen_panel: true     # all 23, whatever their tier
    exclude_self: true
    abundance_window_log2: 0.25    # |median log2CPM(candidate) - target| <= this
    min_detection_rate: 0.50       # detected in >= 50% of tumours in that cohort
  max_genes: 200
  seed: 20260830
  sampling: >
    If more candidates qualify than `max_genes`, take a random sample of that
    size under `seed`. Deterministic, and the seed is committed here rather than
    chosen at run time.
  feasibility_measured_2026_08_30: >
    In TCGA at the 1.0.0 index: GUCA2A (tumour median log2CPM 2.843) has 769
    qualifying candidates, CDX2 (8.119) has 191. Both far above `max_genes`, so
    the null is a sample rather than a census in both cases, and the window does
    not need widening.
  reported: >
    The null's median and 5th/95th percentiles, the target gene's R-squared, its
    percentile within the null, and its excess over the null median — per gene,
    per cohort, per rung. The null distribution itself is written to the results
    table, not summarised away, so a reader can see its shape.
  honest_limitation: >
    The matched genes are not guaranteed to lack a differentiation story; some
    will have one. That is why this is a null DISTRIBUTION rather than a control
    gene. The claim it supports is narrow and exact: "this gene's R-squared is
    or is not larger than that of typical genes at the same abundance". It is
    not "these genes have no biology".

instrument_checks:
  positive_control:
    name: non_epithelial_fraction_tracks_purity
    statement: >
      The deconvolved non-epithelial (stromal + immune + endothelial) fraction
      correlates with (1 - ABSOLUTE purity) at Pearson r >= 0.5 on the samples
      with an ABSOLUTE call.
    rationale: >
      This validates the instrument without assuming any gene's biology. Purity
      is called from copy number, so it is independent of expression. If the
      deconvolution cannot recover a fraction we already know from an orthogonal
      assay, it cannot be trusted to recover one we do not.
    on_failure: >
      STOP. Report the instrument failure as the Stage 4 result and do not
      report any R-squared. A fraction that does not track purity makes every
      downstream number a statement about deconvolution error.

  negative_control_high_abundance:
    name: housekeeping_does_not_track_fraction
    genes: [ACTB, GAPDH]
    statement: "R-squared(housekeeping ~ mature fraction) < 0.10."
    rationale: >
      If a housekeeping gene tracks mature fraction, the model is picking up
      library size, purity or composition structure rather than biology, and the
      GUCA2A and CDX2 numbers inherit whatever that is.
    on_failure: >
      Report alongside the primary result and treat every R-squared as an upper
      bound. Do not silently drop it.
    known_gap: >
      ACTB and GAPDH are both high-expressed, so this pair tests the TOP of the
      dynamic range and leaves the floor untested — which is where GUCA2A sits
      and where issue #54 showed the confound lives. That gap is closed by
      `negative_control_low_abundance` below, not by this check.

  negative_control_low_abundance:
    name: floor_genes_do_not_track_fraction
    genes: null      # drawn by rule, not named — see `matched_null`
    statement: >
      The abundance-matched null drawn at GUCA2A's expression level has a median
      R-squared, and that median is reported as the floor's baseline. If it
      exceeds 0.10, something at the floor tracks fraction generally.
    rationale: >
      Issue #54's ask, and the direct answer to it. A gene at 1.4% of normal
      loses R-squared to the assay floor whatever its biology, so a low
      R-squared for GUCA2A is only informative against genes that share its
      abundance. This is that reference, drawn by a committed rule rather than
      hand-picked.
    on_failure: >
      A matched-null median above 0.10 means fraction predicts low-abundance
      expression in general — most likely a detection-rate artefact, since
      deeper samples detect more of everything. Report it, and report the
      primary as indeterminate rather than confirmed.

  w2_calibration: >
    W2's attenuation sweep and bulk-recovery curve (§2.2) measure how well
    bulk-derived fractions recover truth on held-out pseudobulk. Stage 4 reports
    its R-squared against that curve rather than in isolation, because an
    attenuated fraction depresses R-squared for reasons that are not biological.

# -----------------------------------------------------------------------------
# Model.
# -----------------------------------------------------------------------------
model:
  outcome_scale: log2_cpm
  outcome_genes: [GUCA2A, CDX2]
  predictor: mature_colonocyte_fraction
  form: ordinary_least_squares
  covariate_context: expression_models   # from config/covariate_set.yaml
  covariates_note: >
    Purity enters here — it is a genuine confounder the moment the predictor is
    expression-derived — and plate enters as a stratum or random effect, per the
    covariate lock's `expression_models` context and open decision #14. The
    covariate set is NOT re-opened by this file.
  variance_reported: >
    Partial R-squared for the fraction term, over and above the covariates, AND
    the marginal R-squared of fraction alone. Both, because the first is the
    honest adjusted quantity and the second is the one §6.2's sentence is about.
  multiplicity: benjamini_hochberg_within_tier

# -----------------------------------------------------------------------------
# Cohorts. Invariant 4: estimate per study, never pool.
# -----------------------------------------------------------------------------
cohorts:
  - name: TCGA-COAD/READ
    role: primary
    n_tumours: 624
  - name: GSE39582
    role: replication
    n_tumours: 566
    note: >
      Affymetrix rather than RNA-seq. Deconvolution on an array cohort is its
      own methodological question; if the S matrix cannot be applied to it,
      report that rather than forcing it.
pooling: >
  Never. Each cohort is estimated independently and reported side by side, as
  W3.8 did for the premise check. The prediction must hold in both to count as
  confirmed.

# -----------------------------------------------------------------------------
# Granularity. The fraction is not one number — it depends on the rung.
# -----------------------------------------------------------------------------
granularity:
  report_across_rungs: true
  rungs_expected: [epithelial, lineage, crypt_position, best4]
  usable_rungs_note: >
    Issue #42: crypt_position degenerates to a two-bin split on ~90% of
    patients and is identical to lineage on 37 of 60 patient-axis pairs, so the
    granularity curve has THREE distinct points, not four. PR #49 adds a
    per-rung QUOTABILITY field and reports that lineage and crypt_position
    remain depth-confounded and must not be quoted.
  quotability_rule: >
    Report the curve across every rung, and mark each point with the rung's
    QUOTABILITY from the reference run. A rung that must not be quoted for the
    decomposition must not be quoted here either. If no rung is both quotable
    and estimable, that is the Stage 4 result and it is reported as such.

# -----------------------------------------------------------------------------
# Estimability. Invariant 1.
# -----------------------------------------------------------------------------
estimability:
  rule: >
    A patient whose mature fraction is not estimable contributes `None`, never
    0.0, and is excluded from the regression rather than entered as zero
    fraction. Entering them as zero would manufacture exactly the compositional
    signal this analysis is testing for.
  reported: >
    n excluded per cohort per rung, with the reason, as an attrition table —
    the same shape build_design already emits for the survival models.

# -----------------------------------------------------------------------------
# What this file does NOT pre-specify, so the omissions are visible.
# -----------------------------------------------------------------------------
not_prespecified:
  - which deconvolution method wins W2's bake-off — that is W2's call and this
    analysis takes whichever it names
  - the S matrix version, which depends on W1's rebuild after #35 and #49
  - whether GSE39582 can carry a deconvolution at all
  - any survival model. Stage 4's variance question is separate from whether
    fraction predicts outcome, and mixing them in one pre-specification would
    let a null in one be reported as the other.
