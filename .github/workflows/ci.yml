name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install shared package
        # Only the thin shared deps. The heavy per-workstream conda envs are not
        # built in CI — CellBender and inferCNV do not belong on a runner.
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests submission

      - name: Test
        # Enforces CLAUDE.md invariants 1, 2, 3, 5 and 10. A red build here means
        # a frozen contract moved — read the failure, do not adjust the test.
        run: pytest -q

  no-data-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject data files in git
        run: |
          bad=$(git ls-files | grep -E '\.(h5ad|h5|loom|mtx|mtx\.gz|rds|RData)$' || true)
          if [ -n "$bad" ]; then
            echo "Data files must not be committed. data/ is gitignored; record"
            echo "the download in data/manifest.csv instead."
            echo "$bad"
            exit 1
          fi
