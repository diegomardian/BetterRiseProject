# W1 — Reference. GSE178341, QC, ambient correction, inferCNV, S matrices.
# Needs 32-64 GB RAM and GPU access. See env/README.md.
name: brp-w1
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=16.1.0
  - pyyaml=6.0.1
  - scipy=1.13.1
  - scanpy=1.10.2
  - anndata=0.10.8
  - h5py=3.11.0
  - leidenalg=0.10.2
  - scrublet=0.2.3
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - jupyterlab=4.2.3
  # R side: SoupX, inferCNV, CopyKAT, scDblFinder
  - r-base=4.3.3
  - r-soupx=1.6.2
  - bioconductor-infercnv=1.18.0
  - bioconductor-scdblfinder=1.16.0
  - r-seurat=5.0.3
  - pip
  - pip:
      # CellBender wants a GPU. CPU-only means overnight runs per sample batch.
      - cellbender==0.3.0
      - -e ..
