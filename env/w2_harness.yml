# W2 — Method. Simulation harness, deconvolution bake-off, cutpoint calibration.
name: brp-w2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=16.1.0
  - pyyaml=6.0.1
  - scipy=1.13.1
  - scikit-learn=1.5.1      # nu-SVR baseline
  - statsmodels=0.14.2
  - scanpy=1.10.2
  - anndata=0.10.8
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - jupyterlab=4.2.3
  - pytest=8.2.2
  - ruff=0.5.0
  # Bake-off contenders. MuSiC and BayesPrism are R.
  #
  # The adapters call R via an Rscript SUBPROCESS with parquet in and parquet
  # out, deliberately not rpy2. rpy2 is pleasanter to write and breaks on
  # version drift between the conda R and the linked libR; the bake-off runs a
  # handful of times, not in a loop, so a fragile in-process binding sitting on
  # the critical path to the week-5 gate is not worth the ergonomics.
  - r-base=4.3.3
  - bioconductor-music=1.0.0
  - r-arrow=16.1.0          # parquet bridge for the Rscript adapters
  - r-devtools=2.4.5        # BayesPrism installs from GitHub
  - pip
  - pip:
      - -e ..
# CIBERSORTx runs as a Docker container with a registered token, not a package.
# Record the container digest in the bake-off notes so the comparison is pinned.
# Request the token in week 1 — it is the only external dependency that can put
# the bake-off on the critical path, and the staged plan exists so that a
# missing token costs two methods rather than the gate.
