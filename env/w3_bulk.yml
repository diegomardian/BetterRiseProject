# W3 — Bulk & clinical. TCGA-COAD/READ, purity, survival. Laptop-fine.
name: brp-w3
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=16.1.0
  - pyyaml=6.0.1
  - scipy=1.13.1
  - statsmodels=0.14.2
  - scikit-learn=1.5.1
  - lifelines=0.29.0        # DSS / PFI models
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - openpyxl=3.1.5          # TCGA-CDR ships as xlsx
  - jupyterlab=4.2.3
  - requests=2.32.3         # GDC API
  - diptest=0.10.0          # Hartigan dip test for the week-2 bimodality check
  # ---------------------------------------------------------------------------
  # ESTIMATE (W3.3) is an R package and is NOT installable from conda. It lives
  # on R-Forge, not CRAN, so there is no conda-forge or bioconda build — the
  # previous `r-estimate=1.0.13` pin here resolved to nothing and made this file
  # unbuildable. r-base stays because W3.3 still needs an interpreter; install
  # the package itself, once, into this env:
  #
  #   conda activate brp-w3
  #   R -e 'install.packages("estimate", repos="http://r-forge.r-project.org")'
  #
  # Record the version you get in results/notes/ when W3.3 runs — it is not
  # pinned here and therefore not reproducible from this file alone.
  # ---------------------------------------------------------------------------
  - r-base=4.3.3
  - pip
  - pip:
      - -e ..
