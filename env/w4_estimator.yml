# W4 — Estimator & replication. Lee cohorts, Kitagawa, bootstrap, cross-checks.
name: brp-w4
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.2
  - pyarrow=16.1.0
  - pyyaml=6.0.1
  - scipy=1.13.1
  - statsmodels=0.14.2      # hierarchical model, patient as grouping factor
  - scikit-learn=1.5.1
  - scanpy=1.10.2
  - anndata=0.10.8
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - jupyterlab=4.2.3
  - pytest=8.2.2
  # Ambient correction, same pipeline SHAPE as W1 — coordinate, do not share
  # code prematurely.
  - r-base=4.3.3
  - r-soupx=1.6.2
  - r-devtools=2.4.5        # cacoa installs from GitHub
  - pip
  - pip:
      - -e ..
# Cross-checks: cacoa (kharchenkolab/cacoa) and QuasiMed. NOT CoCoA-diff — it
# assumes cell fractions are not a mediator, which assumes away the
# compositional arm.
